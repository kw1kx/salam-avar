function streakCard(earned = false) {
  const {count,earnedToday} = streak();
  const title = earned ? (count === 1 ? 'Огонь зажжён!' : 'Держишь темп!') : 'Ударный режим';
  const digit = count % 10;
  const unit = count % 100 >= 11 && count % 100 <= 14 ? 'дней' :
    digit === 1 ? 'день' : digit >= 2 && digit <= 4 ? 'дня' : 'дней';
  const status = earnedToday ? count + ' ' + unit + ' подряд · сегодня в зачёте' :
    count ? count + ' ' + unit + ' подряд · пройди урок сегодня' : 'Пройди урок, чтобы зажечь огонь';
  return '<div class="streak-card' + (earned ? ' streak-earned' : '') +
    '"><span class="streak-flame" aria-hidden="true">🔥</span><div><b>' + title +
    '</b><span class="streak-caption">' + status + '</span></div></div>';
}

function addStop(track,title,state,symbol,open) {

  button.className = 'lesson-stop';
  button.dataset.state = state;
  button.disabled = state === 'locked';
  button.setAttribute('aria-label',title + ', ' + status[state]);
  button.innerHTML = '<span class="stop-icon" aria-hidden="true">' +
    (state === 'done' ? '✓' : state === 'locked' ? '•' : symbol) + '</span><span>' + title + '</span>';
  button.onclick = open;
  track.append(button);
}

function shuffle(items) {
  const result = [...items];
  for (let index = result.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [result[index], result[other]] = [result[other], result[index]];
  }
  return result;
}

let audioContext;
function playSound(notes) {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    audioContext ??= new Audio();
    const play = () => {
      const start = audioContext.currentTime;
      notes.forEach((pitch, index) => {
        const time = start + index * 0.09;
        const tone = audioContext.createOscillator();
        const volume = audioContext.createGain();
        tone.type = 'sine';
        tone.frequency.value = pitch;
        volume.gain.setValueAtTime(0.001, time);
        volume.gain.exponentialRampToValueAtTime(0.12, time + 0.018);
        volume.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
        tone.connect(volume).connect(audioContext.destination);
        tone.start(time);
        tone.stop(time + 0.21);
      });
    };
    if (audioContext.state === 'running') play();
    else audioContext.resume().then(play).catch(() => {});
  } catch {
    // Sound is optional when the browser cannot play audio.
  }
}

function show() {
  animateScreen();
  locked = false;
  const isLesson = mode === 'lesson';
  const ids = mode === 'review' ? [...s.done].sort((a,b)=>a-b) : [0,1,2,3,4];
  const step = isLesson ? lessonSteps[q] : {id:ids[q],type:'av'};
  const total = isLesson ? lessonSteps.length : ids.length;
  const row = data[step.id];
  const meaning = step.type === 'meaning';
  const build = step.type === 'build';
  const label = isLesson ? data[i][0] : mode === 'final' ? 'Финальный диалог' : 'Повторение';
  const title = mode === 'final' ? scenes[q] : row[meaning ? 2 : 3];
  const instruction = build ? 'Собери фразу на аварском' : meaning ? 'Выбери перевод' : 'Выбери ответ на аварском';
  app.innerHTML = '<button id="back">← ' + (mode === 'review' ? 'Повторение' : 'Уроки') +
    '</button><section class="card lesson-card"><small>' + label + ' · ' + (q+1) + ' из ' + total +
    '</small><progress max="' + total + '" value="' + q + '" aria-label="Прогресс задания"></progress>' +
    '<p class="muted">' + instruction + '</p><h2 class="phrase">' + title +
    '</h2><div id="choices"></div><p id="feedback" role="status"></p>' +
    '<button class="primary" id="next" hidden>Дальше →</button></section>';
  document.querySelector('#back').onclick = mode === 'review' ? reviewScreen : home;
  const choices = document.querySelector('#choices');
  const feedback = document.querySelector('#feedback');
  const next = document.querySelector('#next');

  function accept() {
    locked = true;
    playSound([660, 880]);
    feedback.className = 'good';
    feedback.textContent = 'Верно! ' + row[2] + ' — ' + row[3];
    next.hidden = false;
    next.focus({preventScroll:true});
    next.onclick = () => {
      q++;
      if (q < total) show();
      else finish();
    };
  }

  if (build) {
    const words = row[2].split(' ');
    let picked = [];
    choices.innerHTML = '<div id="tile-answer" class="tile-answer" aria-label="Твоя фраза"></div>' +
      '<div id="tile-bank" class="tile-bank" aria-label="Слова"></div><button id="check">Проверить</button>';
    const answer = document.querySelector('#tile-answer');
    const bank = document.querySelector('#tile-bank');
    const check = document.querySelector('#check');
    check.disabled = true;
    for (const word of shuffle(words)) {
      const button = document.createElement('button');
      button.textContent = word;
      bank.append(button);
      button.onclick = () => {
        if (locked) return;
        if (picked.includes(button)) {
          picked = picked.filter(tile => tile !== button);
          bank.append(button);
        } else {
          picked.push(button);
          answer.append(button);
        }
        feedback.textContent = '';
        check.disabled = picked.length !== words.length;
      };
    }
    check.onclick = () => {
      if (picked.map(tile => tile.textContent).join(' ') === row[2]) {
        check.hidden = true;
        accept();
      } else {
        feedback.className = 'bad';
        feedback.textContent = 'Проверь порядок. Нажми на слово, чтобы вернуть его в набор.';
      }
    };
    return;
  }

  choices.className = 'stack';
  const column = meaning ? 3 : 2;
  const distractors = shuffle(data.filter(item => item !== row)).slice(0,2);
  for (const option of shuffle([row,...distractors])) {
    const button = document.createElement('button');
    button.textContent = option[column];
    choices.append(button);
    button.onclick = () => {
      if (locked) return;
      if (option === row) accept();
      else {
        feedback.className = 'bad';
        feedback.textContent = 'Попробуй ещё раз.';
        button.disabled = true;
      }
    };
  }
}
